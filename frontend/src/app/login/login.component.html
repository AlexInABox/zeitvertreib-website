<div class="m3-canvas m3-canvas--fill">
  <app-m3-nav />

  <main class="m3-page login-page">
    <div class="login-layout">
      <!-- Copy -->
      <div class="login-copy">
        <img class="login-star" src="/assets/logos/inverted/logo_full_1to1.svg" alt="" aria-hidden="true" />
        <span class="m3-eyebrow">Anmeldung</span>
        <h1 class="m3-page-title">Zeitvertreib.</h1>
        <p class="m3-page-lead">
          Melde dich mit deinem Discord-Account an, um dein Zeitvertreib-Konto zu verknüpfen.
        </p>
      </div>

      <!-- Login panel -->
      <section class="m3-panel login-panel">
        <div class="m3-panel-head">
          <span class="m3-panel-title">Konto verknüpfen</span>
          <span class="m3-chip m3-chip--brand">
            <app-icon name="discord" />
            Discord
          </span>
        </div>

        <div class="m3-panel-body m3-stack">
          <div class="m3-notice">
            <app-icon name="info" />
            <span>
              Dein Discord-Account muss mit Steam verknüpft sein, um Zugriff auf deine Statistiken und Features zu
              erhalten.
            </span>
          </div>

          <button type="button" class="m3-btn m3-btn--wide" (click)="login()">
            <app-icon name="discord" />
            Mit Discord anmelden
          </button>
        </div>
      </section>
    </div>
  </main>

  <app-m3-footer />
</div>
