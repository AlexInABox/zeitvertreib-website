name: Quality Checks (Pull Request)

on:
  pull_request_target:
    branches:
      - '**'
    types:
      - opened
      - edited
      - synchronize

jobs:
  determine-next-build:
    name: Determine Next Build
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine next build number
        id: version
        run: |
          TAG=$(git tag -l "build-*" --sort=-v:refname | head -n 1)

          if [ -z "$TAG" ]; then
            BUILD_NUMBER=1
          else
            BUILD_NUMBER=${TAG#build-}
            BUILD_NUMBER=$((BUILD_NUMBER + 1))
          fi

          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

  validate-main-changelog:
    name: Validate Main Branch Changelog
    if: github.event.pull_request.base.ref == 'main'
    needs: [determine-next-build]
    uses: ./.forgejo/workflows/REUSABLE_extract-changelog.yml
    with:
      build_number: ${{ needs.determine-next-build.outputs.build_number }}
      ref: ${{ github.event.pull_request.head.sha }}

  set-labels:
    name: Set Labels
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .forgejo/labeler.yml
          sync-labels: true

  assign-author:
    name: Assign Author
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR author
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          curl -fsS -X PATCH "$GITHUB_API_URL/repos/${{ github.repository }}/issues/$PR_NUMBER" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"assignees\":[\"$AUTHOR\"]}"

  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([^)]*\))?!?: .+'; then
            echo "::error::PR title must follow Conventional Commits (e.g. 'feat: add x', 'fix: resolve y')"
            exit 1
          fi
