name: Formatting & Linting DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  prettier:
    name: 🖌️ Prettier Autoformat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v6

      - name: Prettify code
        uses: https://github.com/creyD/prettier_action@v4.6
        with:
          prettier_options: --write .

      - name: Commit changes
        uses: https://github.com/stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: format code with Prettier'
          branch: ${{ github.head_ref }}
