name: Proxied Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - 'proxied/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v6

      - uses: https://github.com/docker/setup-buildx-action@v4

      - id: downcase
        name: downcase REPO_OWNER
        run: |
          OWNER=${GITHUB_REPOSITORY%%/*}
          echo "REPO_OWNER=${OWNER,,}" >> $GITHUB_OUTPUT

      - name: Login to Forgejo Container Registry
        run: |
          PASSWORD="${{ secrets.REGISTRY_TOKEN }}"
          if [ -z "$PASSWORD" ]; then
            PASSWORD="${{ secrets.GITHUB_TOKEN }}"
          fi
          echo "$PASSWORD" | docker login git.zeitvertreib.vip \
            --username "${{ github.repository_owner }}" \
            --password-stdin

      - id: tags
        run: |
          OWNER=${{ steps.downcase.outputs.REPO_OWNER }}
          IMG="git.zeitvertreib.vip/${OWNER}/zeitvertreib-proxied"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tags=$IMG:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=$IMG:${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: https://github.com/docker/build-push-action@v7
        with:
          context: proxied
          file: proxied/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
