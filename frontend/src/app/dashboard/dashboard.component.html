<div class="dashboard-shell relative z-10">
  <!-- Loading State -->
  @if (isLoading) {
    <div class="loading-state">
      <div class="text-center text-white">
        <ui-spinner [size]="40" class="mx-auto mb-4" />
        <p class="text-xl font-medium">Lade Statistiken...</p>
      </div>
    </div>
  }

  <!-- Error State -->
  @if (hasError && !isLoading) {
    <div class="error-state">
      <div class="error-message max-w-md mx-auto">
        <h3 class="text-xl font-bold mb-2">Fehler beim Laden</h3>
        <p class="mb-4">{{ errorMessage }}</p>
        <ui-button variant="success" (click)="refreshStats()">Erneut versuchen</ui-button>
      </div>
    </div>
  }

  <!-- Main Content -->
  @if (!isLoading && !hasError) {
    <!-- User sidebar — source of truth -->
    <aside class="dashboard-sidebar">
      <app-user-sidebar [userStatistics]="userStatistics" />
    </aside>

    <!-- Functional area -->
    <main class="dashboard-main">
      <div class="functional-grid">
        <!-- Quests -->
        <div class="grid-item func-span-2">
          <app-quests></app-quests>
        </div>

        <!-- Sprays -->
        <div class="grid-item">
          <app-spray-management [isDonator]="isDonator"></app-spray-management>
        </div>

        <!-- Fakerank -->
        <div class="grid-item">
          <app-fakerank [isDonator]="isDonator"></app-fakerank>
        </div>
      </div>
    </main>
  }
</div>
