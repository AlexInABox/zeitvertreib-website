<section class="jule-panel">
  <div class="jule-panel-head">
    <div class="pf-head">
      <app-icon name="ban" />
      <div class="pf-head-copy">
        <h2 class="pf-title">Coin-Beschränkung</h2>
        <span class="pf-sub">Senden von Coins deaktiviert</span>
      </div>
    </div>
  </div>

  <dl class="jule-gear jule-panel-body">
    <div class="jule-gear-row">
      <dt>Grund</dt>
      <dd class="cr-warn">{{ coinRestriction()?.reason }}</dd>
    </div>
    @if (!coinRestriction()?.isPermanent) {
      <div class="jule-gear-row">
        <dt>Gültig bis</dt>
        <dd>{{ getDateDisplay(coinRestriction()?.restrictedUntil) }}</dd>
      </div>
    }
    @if (coinRestriction()?.isPermanent) {
      <div class="jule-gear-row">
        <dt>Dauer</dt>
        <dd class="cr-danger">Dauerhaft</dd>
      </div>
    }
  </dl>
</section>
