<!-- Loading State -->
@if (isLoading) {
  <div class="loading-state">
    <div class="text-center text-white">
      <ui-spinner [size]="40" class="mx-auto mb-4" />
      <p class="text-xl font-medium">Lade Statistiken...</p>
    </div>
  </div>
}

<!-- Error State -->
@if (hasError && !isLoading) {
  <div class="error-state">
    <div class="error-message max-w-md mx-auto">
      <h3 class="text-xl font-bold mb-2">Fehler beim Laden</h3>
      <p class="mb-4">{{ errorMessage }}</p>
      <ui-button variant="success" (click)="refreshStats()">Erneut versuchen</ui-button>
    </div>
  </div>
}

@if (!isLoading && !hasError) {
  <div class="m3-canvas dash-canvas">
    <app-m3-nav />

    <!-- Welcome card: right third of the content area between the canvas hairlines -->
    <aside class="dash-welcome">
      <div class="dash-welcome-row">
        <img
          class="dash-welcome-avatar"
          [src]="userStatistics.avatarFull || fallbackImg"
          [alt]="userStatistics.username"
          (error)="onImgFallback($event)"
        />
        <div class="dash-welcome-lines">
          <span class="dash-welcome-hello">Willkommen zurück,</span>
          <span class="dash-welcome-name">{{ userStatistics.username }}</span>
        </div>
      </div>
    </aside>

    <app-m3-footer />
  </div>
}
