<!-- Full Variant -->
@if (variant() === 'full') {
  <a href="https://discord.gg/MhQ4Wp7GfS" target="_blank" rel="noopener noreferrer" class="discord-stats-card">
    <div class="discord-icon">
      <app-icon name="discord" />
    </div>
    <div class="discord-info">
      <span class="discord-title">Discord Community</span>
      <div class="discord-counts">
        <span class="discord-stat">
          <span class="discord-dot members"></span>
          <span class="discord-count">{{ discordMemberCount }}</span> Mitglieder
        </span>
        <span class="discord-stat">
          <span class="discord-dot online"></span>
          <span class="discord-count">{{ discordOnlineCount }}</span> Online
        </span>
      </div>
    </div>
    <span class="discord-join">Beitreten →</span>
  </a>
}

<!-- Mini Variant -->
@if (variant() === 'mini') {
  <a href="https://discord.gg/MhQ4Wp7GfS" target="_blank" rel="noopener noreferrer" class="discord-stats-mini">
    <div class="discord-mini-icon">
      <app-icon name="discord" />
    </div>
    <div class="discord-mini-stats">
      <span class="discord-mini-count">{{ discordMemberCount }}</span>
      <span class="discord-mini-label">Mitglieder</span>
    </div>
    <div class="discord-mini-divider"></div>
    <div class="discord-mini-stats">
      <span class="discord-mini-online">{{ discordOnlineCount }}</span>
      <span class="discord-mini-label">Online</span>
    </div>
  </a>
}
